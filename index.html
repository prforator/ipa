<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Установка iOS Приложений</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --accent: #007aff;
            --border-radius: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .header-container {
            position: sticky;
            top: 0;
            background: rgba(242, 242, 247, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 20px 10px;
            z-index: 100;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 28px;
            font-weight: 700;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #e3e3e8;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: background 0.2s;
        }
        
        .search-box:focus {
            background: #d1d1d6;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none; /* Для Firefox */
        }
        .categories::-webkit-scrollbar {
            display: none; /* Для Chrome/Safari */
        }

        .category-btn {
            background: #e3e3e8;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn.active {
            background: var(--text-main);
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            text-align: center;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s;
        }

        .app-card:active {
            transform: scale(0.96);
        }

        /* Заглушка под иконку. Потом сюда добавишь <img> */
        .app-icon {
            width: 70px;
            height: 70px;
            background: #e5e5ea;
            border-radius: 16px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-muted);
            overflow: hidden; /* Чтобы реальные картинки не вылезали за скругления */
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h2 {
            margin: 0 0 2px;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .real-name {
            margin: 0 0 5px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .version {
            margin: 0 0 12px;
            font-size: 11px;
            color: #c7c7cc;
        }

        .install-btn {
            margin-top: auto;
            display: block;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        /* Утилита для скрытия элементов */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Приложения</h1>
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск (например, Т-Банк или AirPilot)..." onkeyup="filterApps()">
        
        <div class="categories" id="categoryFilters">
            <button class="category-btn active" data-filter="all">Все</button>
            <button class="category-btn" data-filter="bank">Банки</button>
            <button class="category-btn" data-filter="delivery">Доставка</button>
            <button class="category-btn" data-filter="social">Соцсети</button>
            <button class="category-btn" data-filter="other">Прочее</button>
        </div>
    </div>

    <div class="grid" id="appsGrid">
        
        <!-- Пример 1: Т-Банк -->
        <div class="app-card" data-category="bank" data-search="airpilot т-банк тинькофф tinkoff">
            <div class="app-icon">A</div>
            <h2>AirPilot</h2>
            <p class="real-name">Т-Банк</p>
            <p class="version">Версия: 2.1.1</p>
            <a class="install-btn" href="itms-services://?action=download-manifest&url=https://prforator.github.io/ipa/tbank-Air.plist">Установить</a>
        </div>

        <!-- Пример 2: Т-Банк (другая маскировка) -->
        <div class="app-card" data-category="bank" data-search="drive t т-банк тинькофф tinkoff">
            <div class="app-icon">D</div>
            <h2>Drive T</h2>
            <p class="real-name">Т-Банк</p>
            <p class="version">Версия: 1.8.1</p>
            <a class="install-btn" href="itms-services://?action=download-manifest&url=https://prforator.github.io/ipa/tbank-DriveT.plist">Установить</a>
        </div>

        <!-- Пример 3: Альфа-Банк -->
        <div class="app-card" data-category="bank" data-search="все учтено альфа банк alfa">
            <div class="app-icon">В</div>
            <h2>Все Учтено</h2>
            <p class="real-name">Альфа-Банк</p>
            <p class="version">Версия: 1.2.7</p>
            <a class="install-btn" href="itms-services://?action=download-manifest&url=https://prforator.github.io/ipa/akbarsbank.plist">Установить</a>
        </div>

        <!-- Пример 4: Доставка -->
        <div class="app-card" data-category="delivery" data-search="купер сбермаркет доставка еда">
            <div class="app-icon">К</div>
            <h2>Купер</h2>
            <p class="real-name">СберМаркет</p>
            <p class="version">Версия: 17.0.518</p>
            <a class="install-btn" href="itms-services://?action=download-manifest&url=https://prforator.github.io/ipa/kuper.plist">Установить</a>
        </div>

        <!-- Пример 5: Соцсети -->
        <div class="app-card" data-category="social" data-search="vk вк вконтакте">
            <div class="app-icon">V</div>
            <h2>VK</h2>
            <p class="real-name">ВКонтакте</p>
            <p class="version">Версия: 8.183</p>
            <a class="install-btn" href="itms-services://?action=download-manifest&url=https://prforator.github.io/ipa/VK.plist">Установить</a>
        </div>

    </div>

    <script>
        let currentFilter = 'all';

        // Логика переключения табов категорий
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Снимаем активность со всех кнопок
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                // Добавляем нажатой
                e.target.classList.add('active');
                
                currentFilter = e.target.getAttribute('data-filter');
                filterApps();
            });
        });

        // Главная функция фильтрации (Категория + Поиск)
        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.app-card');

            cards.forEach(card => {
                const category = card.getAttribute('data-category');
                const searchData = card.getAttribute('data-search').toLowerCase();

                // Проверяем совпадение по категории
                const matchesCategory = (currentFilter === 'all') || (category === currentFilter);
                // Проверяем совпадение по тексту
                const matchesSearch = searchData.includes(query);

                // Показываем только если совпадает и то, и другое
                if (matchesCategory && matchesSearch) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
