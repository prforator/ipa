<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07080e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/ipa/icon.png">
    <link rel="apple-touch-icon" href="/ipa/icon.png">
    <title>Каталог приложений</title>

    <style>
        :root {
            --bg-deep: #07080e;
            --glass-bg: rgba(24, 27, 42, 0.58);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.22);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            --accent-glow: #38bdf8;
            --accent-blue: #0a84ff;
            --badge-bg: rgba(255, 255, 255, 0.08);
            --badge-text: #cbd5e1;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100dvh;
            padding: max(20px, env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(85px);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        .glow-1 {
            width: 300px;
            height: 300px;
            top: -50px;
            left: -70px;
            background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
        }
        .glow-2 {
            width: 340px;
            height: 340px;
            top: 35%;
            right: -90px;
            background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
        }
        .glow-3 {
            width: 280px;
            height: 280px;
            bottom: 40px;
            left: -50px;
            background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
        }

        .header {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto 18px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.6px;
            margin-bottom: 14px;
            text-align: center;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #fff;
        }

        .search-wrap {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 0 16px 0 42px;
            font-size: 16px;
            font-family: inherit;
            color: #fff;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 8px 24px rgba(0, 0, 0, 0.25);
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input::placeholder {
            color: var(--text-sub);
        }

        .search-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 18px rgba(56, 189, 248, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        }

        .search-input:focus-visible {
            outline: 2px solid var(--accent-glow);
            outline-offset: 2px;
        }

        /* скрываем нативное "украшение" поиска, оставляем кнопку очистки */
        .search-input::-webkit-search-decoration {
            -webkit-appearance: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-sub);
            pointer-events: none;
            z-index: 2;
        }

        .cards-list {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .app-row {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 var(--glass-highlight);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s;
        }

        .app-card {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 var(--glass-highlight);
        }

        .app-card .app-row {
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        .app-footer {
            padding: 0 14px 12px;
            margin-top: -2px;
        }

        .btn-activate {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 38px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 13px;
            text-decoration: none;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-activate:active {
            transform: scale(0.98);
            background: rgba(56, 189, 248, 0.22);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .icon-stack {
            position: relative;
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }

        .icon-main {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        .icon-main img,
        .icon-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .icon-badge {
            position: absolute;
            bottom: -3px;
            right: -3px;
            width: 25px;
            height: 25px;
            border-radius: 8px;
            background: #1e293b;
            border: 2px solid #111522;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
        }

        .app-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .app-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-mask-title {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            align-self: flex-start;
            background: var(--badge-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--badge-text);
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 7px;
            margin-top: 2px;
        }

        .btn-download {
            background-color: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #0a84ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.2px;
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 999px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }

        .btn-download:active {
            transform: scale(0.95);
            background-color: #2c2c2e;
        }

        /* Empty state */
        .empty-state {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 48px auto;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            fill: var(--text-dim);
            opacity: 0.55;
            margin-bottom: 4px;
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .empty-state span {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.45;
            max-width: 280px;
        }

        .btn-reset {
            margin-top: 10px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 20px;
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .btn-reset:active {
            transform: scale(0.97);
            background: rgba(56, 189, 248, 0.22);
        }

        .tabbar-wrap {
            position: fixed;
            bottom: max(14px, env(safe-area-inset-bottom));
            left: 0;
            right: 0;
            padding: 0 12px;
            display: flex;
            justify-content: center;
            z-index: 999;
            pointer-events: none;
        }

        .tabbar {
            pointer-events: auto;
            width: auto;
            max-width: calc(100vw - 24px);
            background: rgba(18, 22, 36, 0.72);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 32px;
            padding: 5px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            height: 40px;
            min-width: 42px;
            padding: 0 10px;
            border-radius: 22px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            flex-shrink: 1;
            font-family: inherit;
        }

        .tab-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .tab-label {
            display: none;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            letter-spacing: -0.2px;
        }

        .tab-btn.active {
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #ffffff;
            padding: 0 14px;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .tab-btn.active .tab-label {
            display: inline;
        }

        /* Focus ring для всех интерактивных элементов */
        .tab-btn:focus-visible,
        .btn-download:focus-visible,
        .btn-activate:focus-visible,
        .btn-reset:focus-visible {
            outline: 2px solid var(--accent-glow);
            outline-offset: 2px;
        }

        @media (max-width: 340px) {
            .tab-label { display: none !important; }
            .tab-btn { padding: 0 8px !important; min-width: 38px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (forced-colors: active) {
            .header h1 {
                background: none;
                -webkit-text-fill-color: currentColor;
                color: CanvasText;
            }
            .app-row, .app-card, .tabbar, .search-input {
                border: 1px solid CanvasText;
            }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="header">
        <h1>Каталог</h1>
        <div class="search-wrap" role="search">
            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Поиск приложения..."

            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
    </div>

    <div class="cards-list" id="appsContainer"></div>

    <div class="empty-state hidden" id="emptyState" role="status">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <p>Ничего не найдено</p>
        <span>Попробуйте изменить запрос или выбрать другую категорию</span>
        <button type="button" class="btn-reset" id="resetBtn">Сбросить</button>
    </div>

    <div class="tabbar-wrap">
        <div class="tabbar" role="group" aria-label="Категории">
            <button type="button" class="tab-btn active" data-filter="all" aria-pressed="true" aria-label="Все">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
                <span class="tab-label">Все</span>
            </button>
            <button type="button" class="tab-btn" data-filter="bank" aria-pressed="false" aria-label="Банки">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v7h3v-7H4zm6.5 0v7h3v-7h-3zM2 22h20v-3H2v3zm15-12v7h3v-7h-3zm-5-9L2 6v2h20V6l-10-5z"/></svg>
                <span class="tab-label">Банки</span>
            </button>
            <button type="button" class="tab-btn" data-filter="shop" aria-pressed="false" aria-label="Магазины">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/></svg>
                <span class="tab-label">Магазины</span>
            </button>
            <button type="button" class="tab-btn" data-filter="social" aria-pressed="false" aria-label="Соцсети">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                <span class="tab-label">Соцсети</span>
            </button>
            <button type="button" class="tab-btn" data-filter="other" aria-pressed="false" aria-label="Прочее">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="tab-label">Прочее</span>
            </button>
        </div>
    </div>

        const CYR_MAP = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya' };

        function translit(str) {
            let out = '';
            for (const ch of String(str).toLowerCase()) out += CYR_MAP[ch] || ch;
            return out;
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        // оставляем только безопасные символы для имён файлов
        function sanitizeId(s) {
            return String(s || '').replace(/[^a-zA-Z0-9_.-]/g, '');
        }

        function buildSearchIndex(app) {
            const base = [
                app.t,
                app.m,
                app.p,
                app.i,
                app.b,
                app.s,
                translit(app.t),
                translit(app.m || '')
            ].filter(Boolean).join(' ').toLowerCase();

            let extra = '';
            if (/сбер/.test(base)) extra += ' sber';
            if (/т-банк|т-ж/.test(base)) extra += ' тинькофф tinkoff';
            if (/альфа/.test(base)) extra += ' alfa';
            if (/втб/.test(base)) extra += ' vtb';
            if (/псб/.test(base)) extra += ' psb промсвязьбанк';
            if (/россельхозбанк|свой бизнес/.test(base)) extra += ' рсхб';
            if (/совком/.test(base)) extra += ' халва sovcom';
            if (/авито/.test(base)) extra += ' avito';

            return (base + extra).replace(/[^a-zа-я0-9]+/gi, ' ').trim();
        }

        const container = document.getElementById('appsContainer');
        const emptyState = document.getElementById('emptyState');
        const resetBtn = document.getElementById('resetBtn');
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab-btn');

        const searchIndex = new WeakMap();
        const frag = document.createDocumentFragment();

        APPS.forEach(app => {
            const safeP = sanitizeId(app.p);
            const safeI = sanitizeId(app.i || app.p);
            const safeB = app.b ? sanitizeId(app.b) : '';

            const innerUrl = `https://prforator.github.io/ipa/plists/${safeP}.plist`;
            const plistUrl = `itms-services://?action=download-manifest&url=${encodeURIComponent(innerUrl)}`;
            const iconSrc = `icons_original/${safeI}.webp`;
            const badgeSrc = safeB ? `icons_masked/${safeB}.webp` : '';

            const title = escapeHtml(app.t);
            const maskTitle = app.m ? escapeHtml(app.m) : '';
            const categoryName = escapeHtml(CATEGORY_NAMES[app.c] || '');
            const activateHref = app.a ? escapeHtml(app.a) : '';
            const activateExt = app.ext ? ' target="_blank" rel="noopener noreferrer"' : '';

            const card = document.createElement('div');
            card.dataset.category = app.c;
            searchIndex.set(card, buildSearchIndex(app));

            const rowHtml = `
                <div class="app-left">
                    <div class="icon-stack">
                        <div class="icon-main"><img src="${iconSrc}" alt="" loading="lazy" decoding="async"></div>
                        ${badgeSrc ? `<div class="icon-badge"><img src="${badgeSrc}" alt="" loading="lazy" decoding="async"></div>` : ''}
                    </div>
                    <div class="app-meta">
                        <div class="app-title">${title}</div>
                        ${maskTitle ? `<div class="app-mask-title">${maskTitle}</div>` : ''}
                        <div class="badge">${categoryName}</div>
                    </div>
                </div>
                <a class="btn-download" href="${plistUrl}" aria-label="Установить ${title}">Установить</a>
            `;

            if (app.a) {
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-row">${rowHtml}</div>
                    <div class="app-footer">
                        <a class="btn-activate" href="${activateHref}"${activateExt} aria-label="Активировать ${title}">Активировать</a>
                    </div>
                `;
            } else {
                card.className = 'app-row';
                card.innerHTML = rowHtml;
            }

            // Мягкий fallback: если иконка битая — скрываем её, остаётся подложка
            card.querySelectorAll('img').forEach(img => {
                if (img.complete && img.naturalHeight === 0) {
                    img.style.visibility = 'hidden';
                } else {
                    img.addEventListener('error', () => { img.style.visibility = 'hidden'; }, { once: true });
                }
            });

            frag.appendChild(card);
        });

        container.appendChild(frag);

        const cards = Array.from(container.children);
        let currentFilter = 'all';

        function filterApps() {
            const query = searchInput.value.trim().toLowerCase();
            let visibleCount = 0;

            cards.forEach(card => {
                const matchesCategory = currentFilter === 'all' || card.dataset.category === currentFilter;
                const haystack = searchIndex.get(card) || '';
                const matchesSearch = !query || haystack.includes(query);
                const visible = matchesCategory && matchesSearch;
                card.classList.toggle('hidden', !visible);
                if (visible) visibleCount++;
            });

            emptyState.classList.toggle('hidden', visibleCount > 0);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(item => {
                    item.classList.remove('active');
                    item.setAttribute('aria-pressed', 'false');
                });
                tab.classList.add('active');
                tab.setAttribute('aria-pressed', 'true');
                currentFilter = tab.dataset.filter;
                filterApps();
            });
        });

        // rAF-дебаунс для поиска
        let searchRaf = 0;
        searchInput.addEventListener('input', () => {
            cancelAnimationFrame(searchRaf);
            searchRaf = requestAnimationFrame(filterApps);
        });

        resetBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentFilter = 'all';
            tabs.forEach(t => {
                const isActive = t.dataset.filter === 'all';
                t.classList.toggle('active', isActive);
                t.setAttribute('aria-pressed', String(isActive));
            });
            filterApps();
        });
    </script>
